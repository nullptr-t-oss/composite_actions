name: 'Fetch KSU Manager'
description: "Downloads KSU (or its fork) manager APK (normal + spoofed) built by a KSU (or its fork) repo's CI for a given commit, and stages them into a dist dir with type-prefixed names"

inputs:
  ksu-type:
    description: "KSU variant to fetch (currently supported: 'ksu', 'ksun', 'kowsu' & 'rksu' )"
    required: true
  dist-dir:
    description: 'Directory to place the renamed APKs into'
    required: true
  commit-hash:
    description: 'Full commit SHA on the KSU manager repo to pull the built manager from'
    required: true
  github-token:
    description: 'Token with Actions read access to the target repo (defaults to the calling workflow token)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Resolve KSU repo
      id: resolve
      shell: bash
      run: |
        # Extracted this from kali's default colorscheme
        red="\033[38;2;236;1;1m"
        blue="\033[38;2;39;127;255m"
        green="\e[38;2;71;212;185m"
        yellow="\e[38;2;254;164;76m"
        end="\e[0m"
        _name="[${yellow}fetch_ksu_manager${end}]"

        case "${{ inputs.ksu-type }}" in
          ksu)
            echo "repo=tiann/KernelSU" >> "${GITHUB_OUTPUT}"
            echo "workflow=Build Manager" >> "${GITHUB_OUTPUT}"
            echo -e "${_name} [${blue}log${end}] repo is set to: ${green}tiann/KernelSU${end}"
            ;;
          ksun)
            echo "repo=KernelSU-Next/KernelSU-Next" >> "${GITHUB_OUTPUT}"
            echo "workflow=Build Manager CI" >> "${GITHUB_OUTPUT}"
            echo -e "${_name} [${blue}log${end}] repo is set to: ${green}KernelSU-Next/KernelSU-Next${end}"
            ;;
          kowsu)
            echo "repo=KOWX712/KernelSU" >> "${GITHUB_OUTPUT}"
            echo "workflow=Build Manager" >> "${GITHUB_OUTPUT}"
            echo -e "${_name} [${blue}log${end}] repo is set to: ${green}KOWX712/KernelSU${end}"
            ;;
          rksu)
            echo "repo=ReSukiSU/ReSukiSU" >> "${GITHUB_OUTPUT}"
            echo "workflow=Build Manager" >> "${GITHUB_OUTPUT}"
            echo -e "${_name} [${blue}log${end}] repo is set to: ${green}ReSukiSU/ReSukiSU/${end}"
            ;;
          *)
            echo -e "${_name} [${red}error${end}] input ksu-type ${red}'${{ inputs.ksu-type }}'${end} is not supported at the moment"
            exit 1
            ;;
        esac

    - name: Find manager run
      id: find-run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        # Cant think of any better impl atm so just ctrl c+ ctrl v to every step to prettify output
        # Using github outputs will increase the variable name (steps.resolve.ouputs.foo)
        # Extracted this from kali's default colorscheme
        red="\033[38;2;236;1;1m"
        blue="\033[38;2;39;127;255m"
        green="\e[38;2;71;212;185m"
        yellow="\e[38;2;254;164;76m"
        end="\e[0m"
        _name="[${yellow}fetch_ksu_manager${end}]"

        REPO="${{ steps.resolve.outputs.repo }}"
        WORKFLOW="${{ steps.resolve.outputs.workflow }}"
        SHA="${{ inputs.commit-hash }}"

        RUN_ID=$(gh run list \
          --repo "${REPO}" \
          --commit "${SHA}" \
          --workflow "${WORKFLOW}" \
          --json databaseId,status \
          --jq '[.[] | select(.status == "completed")][0].databaseId')

        if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" == "null" ]; then
          echo -e "${_name} [${red}error${end}] no completed ${blue}'${WORKFLOW}'${end} run found for commit ${red}${SHA}${end} on ${red}${REPO}${end}"
          # Dont exit just warn the user
        fi

        echo -e "${_name} [${blue}log${end}] Resolved run: ${green}${RUN_ID}${end}"
        echo "run-id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

    - name: Download manager artifacts
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        # Extracted this from kali's default colorscheme
        red="\033[38;2;236;1;1m"
        blue="\033[38;2;39;127;255m"
        green="\e[38;2;71;212;185m"
        yellow="\e[38;2;254;164;76m"
        end="\e[0m"
        _name="[${yellow}fetch_ksu_manager${end}]"

        REPO="${{ steps.resolve.outputs.repo }}"
        RUN_ID="${{ steps.find-run.outputs.run-id }}"

        rm -rf /tmp/_ksu_manager_dl
        mkdir -p /tmp/_ksu_manager_dl

        echo -e "${_name} [${blue}log${end}] fetching manager artifacts"
        gh run download "${RUN_ID}" --repo "${REPO}" --pattern "manager*" -D /tmp/_ksu_manager_dl

    - name: Rename and stage into dist dir
      shell: bash
      run: |
        set -euo pipefail

        # Extracted this from kali's default colorscheme
        red="\033[38;2;236;1;1m"
        blue="\033[38;2;39;127;255m"
        green="\e[38;2;71;212;185m"
        yellow="\e[38;2;254;164;76m"
        end="\e[0m"
        _name="[${yellow}fetch_ksu_manager${end}]"

        DIST="${{ inputs.dist-dir }}"
        TYPE="${{ inputs.ksu-type }}"
        mkdir -p "${DIST}"

        staged=0

        for dir in /tmp/_ksu_manager_dl/*/; do
          [ -d "${dir}" ] || continue

          artifact_name="$(basename "${dir}")"

          # NOTE: Derive the suffix from a COPY, never mutate artifact_name itself —
          # it's still needed below for log/warning messages.

          # must support these variants as of now:
          # manager -> ''
          # manager-spoofed -> '_spoofed'
          # manager-gradle -> '_gradle'
          # Manager-Debug -> '_debug'
          # Manager-Release -> '_release'
          # Spoofed-Manager-Release -> '_spoofed_release'
          suffix_raw="$(echo "${artifact_name}" | tr '[:upper:]' '[:lower:]')" # lowercase, coz of rksu
          suffix_raw="${suffix_raw//manager/}"    # strip "manager" prefix only (not any occurrence)
          suffix_raw="${suffix_raw//-/_}"       # replace all (-) with (_)
          suffix_raw="${suffix_raw#_}"          # drop a leading (_) left over from the dash swap above, so we don't double it up when prefixing below
          suffix_raw="${suffix_raw//__/_}"      # collapse any remaining (__) into (_), (for rksu)
 
          if [[ -z "${suffix_raw}" ]]; then
            suffix=""
          else
            # single underscore separator for every variant, dash-based (ksun/ksu/kowsu)
            # or dashless (rksu)
            suffix="_${suffix_raw}"
          fi

          apk=$(find "${dir}" -maxdepth 1 -name '*.apk' | head -n1)
          if [ -z "${apk}" ]; then
            echo -e "${_name} [${yellow}warning${end}] no APK found in artifact ${yellow}'${artifact_name}'${end}, skipping"
            continue
          fi

          if [ -z "${suffix}" ]; then
            out="${DIST}/${TYPE}.apk"
          else
            out="${DIST}/${TYPE}${suffix}.apk"
          fi

          cp "${apk}" "${out}"
          echo -e "${_name} [${blue}log${end}] staged: ${green}${out}${end} (from artifact ${green}'${artifact_name}'${end})"
          staged=$((staged + 1))
        done

        if [ "${staged}" -eq 0 ]; then
          echo -e "${_name} [${red}error${end}] no manager APKs were staged — check that ${red}'manager*'${end} artifacts exist for this run"
          # Dont exit just warn the user
        fi

        rm -rf /tmp/_ksu_manager_dl
